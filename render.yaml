# render.yaml - despliegue automático en Render.com
# Coloca este archivo en la raíz del repo ( junto a main.py y requirements.txt )

services:
  - type: web
    name: mediaflow-proxy
    env: python
    region: oregon        # podés cambiar la región si querés (ej: frankfurt, singapore)
    plan: free            # o starter, standard, según lo que quieras
    branch: main
    autoDeploy: true

    # Comandos
    buildCommand: pip install -r requirements.txt
    # Recomiendo usar gunicorn + uvicorn worker en producción; si no querés gunicorn, reemplaza por "uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
    startCommand: gunicorn -k uvicorn.workers.UvicornWorker main:app --bind 0.0.0.0:$PORT --workers 3

    # Variables no-secret (opcional). NO pongas secretos sensibles aquí si no quieres que queden en el repo.
    envVars:
      - key: PORT
        value: "10000"
      - key: MAX_WORKERS
        value: "3"

    # Health check (opcional)
    healthCheckPath: /health
    healthCheckIntervalSeconds: 20
    healthCheckTimeoutSeconds: 10
